name: Build desktop releases

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: windows-x64
            architecture: x64
          - os: macos-15-intel
            target: macos-x64
            architecture: x64
          - os: macos-14
            target: macos-arm64
            architecture: arm64
          - os: ubuntu-22.04
            target: linux-x64
            architecture: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: ${{ matrix.architecture }}
      - name: Install Linux display tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth python3-tk
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Verify Tcl/Tk availability
        run: python -c "import tkinter; print(tkinter.Tcl().eval('info patchlevel'))"
      - name: Run each test module in a separate process
        shell: bash
        run: |
          set -euo pipefail
          echo "Testing commit: $GITHUB_SHA"
          for test_file in tests/test*.py; do
            test_name="$(basename "$test_file")"
            echo "::group::Test module: $test_name"
            if [ "$RUNNER_OS" = "Linux" ]; then
              xvfb-run -a python -m unittest discover -s tests -p "$test_name" -v
            else
              python -m unittest discover -s tests -p "$test_name" -v
            fi
            echo "::endgroup::"
          done
      - name: Build and check native application
        shell: bash
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name || 'v6.0.0' }}
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a python scripts/build_release.py --version "$RELEASE_VERSION"
          else
            python scripts/build_release.py --version "$RELEASE_VERSION"
          fi
      - name: Store release files
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 30

  attach:
    name: Attach packages to the published release
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" release-assets/* --clobber
